<!doctype html>
<meta charset="utf-8" />

<head>
    <title>Dohcord Setup</title>

    <link rel="stylesheet" href="./common.css" type="text/css" />

    <style>
        body {
            height: 100vh;
            padding: 1.5em;
            padding-bottom: 1em;
            border: 1px solid var(--fg-semi-trans);
            border-top: none;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        select {
            background: var(--bg);
            color: var(--fg);
            padding: 0.4em 0.6em;
            border: 1px solid var(--fg-semi-trans);
            border-radius: 6px;
            width: 250px;
            max-width: 100%;
            box-sizing: border-box;
            font-size: 0.9rem;
            cursor: pointer;
        }

        input[type="url"] {
            background: var(--bg);
            color: var(--fg);
            padding: 0.4em 0.6em;
            border: 1px solid var(--fg-semi-trans);
            border-radius: 6px;
            width: 250px;
            max-width: 100%;
            box-sizing: border-box;
            font-size: 0.9rem;
        }

        input[type="url"]::placeholder {
            color: var(--fg-secondary);
            opacity: 0.7;
        }

        h1 {
            margin: 0.4em 0 0;
        }

        p {
            margin: 1em 0 2em;
        }

        form {
            display: grid;
            gap: 1em;
            margin: 0;
        }

        label {
            position: relative;
            display: flex;
            justify-content: space-between;
        }

        label:has(input[type="checkbox"]),
        select {
            cursor: pointer;
        }

        label:not(:last-child)::after {
            content: "";
            position: absolute;
            bottom: -10px;
            width: 100%;
            height: 1px;
            background-color: var(--fg-secondary);
            opacity: 0.5;
        }

        label div {
            display: grid;
            gap: 0.2em;
        }

        label h2 {
            margin: 0;
            font-weight: normal;
            font-size: 1.1rem;
            line-height: 1rem;
        }

        label span {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--fg-secondary);
        }

        #buttons {
            display: flex;
            justify-content: end;
            gap: 0.5em;
            margin-top: 1em;
        }

        button {
            padding: 0.6em;
            background: red;
            color: white;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: 200ms filter;
        }

        button:hover {
            filter: brightness(0.8);
        }

        #submit {
            background: green;
        }

        .doh-custom-input {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.5em;
        }

        .doh-custom-input div {
            flex: 1;
        }

        .doh-custom-input h2 {
            margin: 0;
            font-weight: normal;
            font-size: 1.1rem;
        }

        .doh-custom-input span {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--fg-secondary);
        }

        .doh-custom-input input[type="url"] {
            margin-left: 1em;
        }
    </style>
</head>

<body>
    <h1>Welcome to Dohcord</h1>
    <p>Let's customise your experience!</p>

    <form>
        <label>
            <h2>Discord Branch</h2>
            <select name="discordBranch">
                <option value="stable">stable</option>
                <option value="canary">canary</option>
                <option value="ptb">ptb</option>
            </select>
        </label>

        <label>
            <div>
                <h2>Start with System</h2>
                <span>Automatically open Dohcord when your computer starts</span>
            </div>
            <input type="checkbox" name="autoStart" />
        </label>

        <label>
            <div>
                <h2>Rich Presence</h2>
                <span>Enable Rich presence (game activity) via
                    <a href="https://github.com/OpenAsar/arrpc" target="_blank">arRPC</a></span>
            </div>
            <input type="checkbox" name="richPresence" checked />
        </label>

        <label>
            <div>
                <h2>Import Settings</h2>
                <span>Import Settings from existing Vencord install (if found)</span>
            </div>
            <input type="checkbox" name="importSettings" checked />
        </label>

        <label>
            <div>
                <h2>Minimise to Tray</h2>
                <span>Minimise to Tray when closing</span>
            </div>
            <input type="checkbox" name="minimizeToTray" checked />
        </label>

        <label>
            <div>
                <h2>DNS over HTTPS (DoH)</h2>
                <span>Choose a secure DNS provider to encrypt your queries</span>
            </div>
            <select name="dohProvider" id="dohProviderSelect">
                <option value="off">Off (Disabled)</option>
                <option value="https://cloudflare-dns.com/dns-query">Cloudflare (1.1.1.1)</option>
                <option value="https://dns.google/dns-query">Google (dns.google)</option>
                <option value="https://newipe.qd.je/dns-query">Newipe (newipe.qd.je) - Iran only</option>
                <option value="https://dns.quad9.net/dns-query">Quad9 (dns.quad9.net)</option>
                <option value="https://doh.opendns.com/dns-query">OpenDNS (doh.opendns.com)</option>
                <option value="custom">Custom</option>
            </select>
        </label>

        <div id="dohUrlLabel" style="display: none;" class="doh-custom-input">
            <div>
                <h2>Custom DoH URL</h2>
                <span>Enter your custom DoH provider URL</span>
            </div>
            <input type="url" name="dohUrl" placeholder="https://example.com/dns-query" />
        </div>

        <div id="buttons">
            <button id="cancel">Quit</button>
            <button id="submit">Submit</button>
        </div>
    </form>
</body>

<script>
    const dohProviderSelect = document.getElementById('dohProviderSelect');
    const dohUrlLabel = document.getElementById('dohUrlLabel');
    const dohUrlInput = document.querySelector('input[name="dohUrl"]');
    const remoteResolversUrl = 'https://raw.githubusercontent.com/Newipe/Dohcord/main/resolvers.json';

    fetch(remoteResolversUrl)
        .then(response => response.ok ? response.json() : Promise.reject())
        .then(value => {
            if (!Array.isArray(value)) return;

            const resolvers = value.filter(resolver =>
                resolver &&
                typeof resolver.label === 'string' &&
                typeof resolver.url === 'string' &&
                resolver.label.trim() &&
                resolver.url.startsWith('https://')
            );
            if (!resolvers.length) return;

            dohProviderSelect.replaceChildren(
                new Option('Off (Disabled)', 'off'),
                ...resolvers.map(resolver => new Option(resolver.label, resolver.url)),
                new Option('Custom', 'custom')
            );
        })
        .catch(() => { });

    dohProviderSelect.addEventListener('change', (e) => {
        dohUrlLabel.style.display = e.target.value === 'custom' ? 'flex' : 'none';
        if (e.target.value !== 'custom') {
            dohUrlInput.value = '';
        }
    });

    cancel.onclick = () => console.info("cancel");

    submit.onclick = e => {
        const form = document.querySelector("form");
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        const provider = data.dohProvider;
        if (provider === 'off') {
            data.enableDoh = undefined;
            data.dohUrl = undefined;
        } else if (provider === 'custom') {
            data.enableDoh = 'on';
        } else {
            data.enableDoh = 'on';
            data.dohUrl = provider;
        }

        delete data.dohProvider;

        console.info("form:" + JSON.stringify(data));
        e.preventDefault();
    };
</script>
